name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r sumo/requirements.txt
      - name: Unit tests
        run: cd sumo && python -m pytest tests -q
      - name: SUMO smoke test (one junction, 10 minutes)
        run: |
          cd sumo
          python go2/06_llm_agent.py --minutes 10
